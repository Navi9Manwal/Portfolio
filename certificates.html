<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificates | Navi Manwal</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <!-- External CSS File -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Full Screen Viewer Styling */
        .viewer-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .viewer-img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
            object-fit: contain;
        }
        .viewer-close {
            position: absolute;
            top: 20px; right: 25px;
            color: #fff; font-size: 2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .viewer-close:hover { color: #ff4d4d; }
        
        /* Action buttons layout inside card */
        .card-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* Card Image Preview Box */
        .card-preview {
            background: #161b22;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <!-- Header / Navbar -->
        <header class="navbar">
            <div class="logo">
                <span class="logo-icon">NM</span>
                <div class="logo-text">
                    <strong>NAVI MANWAL</strong>
                    <small>CERTIFICATIONS</small>
                </div>
            </div>
            <nav class="nav-links">
                <a href="index.htm">HOME</a>
                <a href="index.htm#work">PROJECTS</a>
                <a href="index.htm#skills">SKILLS</a>
            </nav>
            <a href="index.htm" class="btn-pill-light"><i class="fa-solid fa-arrow-left"></i> BACK TO HOME</a>
        </header>

        <!-- Certificates Section -->
        <section class="section">
            <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <span class="section-tag">VERIFIED CREDENTIALS & CERTIFICATES</span>
            </div>

            <!-- Certificates Grid -->
            <div class="portfolio-grid" id="portfolio-grid"></div>
        </section>

        <!-- Footer -->
        <footer class="bottom-bar" style="margin-top: 40px;">
            <p>© 2026 Navi Manwal. All Rights Reserved.</p>
            <div class="footer-socials">
                <span>CONNECT</span>
                <a href="#"><i class="fa-brands fa-github"></i></a>
                <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
            </div>
        </footer>
    </div>

    <!-- Full-Screen Image Viewer Modal -->
    <div class="viewer-overlay" id="imageViewerModal" onclick="closeViewer(event)">
        <span class="viewer-close" onclick="closeViewer(event)">&times;</span>
        <img id="fullScreenImage" class="viewer-img" src="" alt="Full Certificate View">
    </div>

    <!-- JavaScript Handler -->
    <script>
        // Certificates Array: Directly edit this list to add or remove certificates
        const certificates = [
            {
                title: "Bug Bounty Certificate",
                issuer: "ISSUED BY • Indian Cyber Club",
                image: "bugbountycert.jpeg",
                link: "bugbountycert.jpeg"
            },
            {
                title: "Cybersecurity Internship",
                issuer: "ISSUED BY • Nischit",
                image: "interncert.png",
                link: "interncert.png"
            },
            {
                title: "Outskill",
                issuer: "ISSUED BY •Outskill",
                image: "outskill.jpeg",
                link: "outskill.jpeg"

            }
        ];

        const FALLBACK_IMAGE = "data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22400%22%20height%3D%22250%22%20viewBox%3D%220%200%20400%20250%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23161b22%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20dominant-baseline%3D%22middle%22%20text-anchor%3D%22middle%22%20fill%3D%22%2358a6ff%22%20font-family%3D%22sans-serif%22%20font-size%3D%2218%22%3ECertificate%20Preview%3C%2Ftext%3E%3C%2Fsvg%3E";

        function renderCertificates() {
            const grid = document.getElementById('portfolio-grid');
            
            grid.innerHTML = certificates.map((cert) => `
                <div class="project-card">
                    <div class="card-preview" style="padding: 0; overflow: hidden; height: 220px; cursor: pointer;" onclick="openViewer('${cert.image}')">
                        <img src="${cert.image}" alt="${cert.title}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.onerror=null; this.src='${FALLBACK_IMAGE}';">
                    </div>
                    <div class="card-info">
                        <div>
                            <h3>${cert.title}</h3>
                            <p>${cert.issuer}</p>
                        </div>
                        <div class="card-actions">
                            <button onclick="openViewer('${cert.image}')" class="icon-btn" title="View Full Screen">
                                <i class="fa-solid fa-expand"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        /* Full Screen Viewer Functions */
        function openViewer(imageSrc) {
            const modal = document.getElementById('imageViewerModal');
            const fullImg = document.getElementById('fullScreenImage');
            fullImg.src = imageSrc;
            fullImg.onerror = function() {
                this.src = FALLBACK_IMAGE;
            };
            modal.style.display = 'flex';
        }

        function closeViewer(e) {
            if (e.target.id === 'imageViewerModal' || e.target.classList.contains('viewer-close')) {
                document.getElementById('imageViewerModal').style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCertificates();
        });
    </script>
</body>
</html>
