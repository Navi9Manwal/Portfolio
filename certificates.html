    <style>
        /* Form & Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 450px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-box h3 { margin-bottom: 15px; font-family: 'Syne', sans-serif; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 0.8rem; color: #8b949e; margin-bottom: 5px; }
        .form-group input {
            width: 100%; padding: 10px; background: #161b22;
            border: 1px solid #30363d; border-radius: 6px; color: #fff; outline: none;
        }
        .form-group input:focus { border-color: #58a6ff; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .btn-add-cert {
            background: #238636; color: white; padding: 8px 16px;
            border-radius: 6px; border: none; cursor: pointer; font-weight: 600;
        }
        .btn-cancel {
            background: #21262d; color: #c9d1d9; padding: 8px 16px;
            border-radius: 6px; border: 1px solid #30363d; cursor: pointer;
        }

        /* Full Screen Viewer Styling */
        .viewer-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .viewer-img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
            object-fit: contain;
        }
        .viewer-close {
            position: absolute;
            top: 20px; right: 25px;
            color: #fff; font-size: 2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .viewer-close:hover { color: #ff4d4d; }
        
        /* Action buttons layout inside card */
        .card-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-delete {
            background: transparent;
            border: none;
            color: #ff4d4d;
            cursor: pointer;
            font-size: 1rem;
            padding: 5px;
            transition: transform 0.2s;
        }
        .btn-delete:hover { transform: scale(1.15); }

        /* Secret Admin Lock Icon */
        .admin-lock-btn {
            background: transparent;
            border: none;
            color: #8b949e;
            cursor: pointer;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .admin-lock-btn:hover { color: #58a6ff; }
        .admin-active { color: #238636 !important; }

        /* Card Image Preview Box */
        .card-preview {
            background: #161b22;
            display: flex;
            align-items: center;
            justify-content: center;
        }

    <!-- Add Certificate Modal -->
    <div class="modal-overlay" id="certModal">
        <div class="modal-box">
            <h3>Add New Certificate</h3>
            <div class="form-group">
                <label>Certificate Title</label>
                <input type="text" id="certTitle" placeholder="e.g. Web Security Professional">
            </div>
            <div class="form-group">
                <label>Issued By</label>
                <input type="text" id="certIssuer" placeholder="e.g. ISSUED BY • PORTSWIGGER">
            </div>
            <div class="form-group">
                <label>Upload Image OR Image Link (Imgur/GitHub)</label>
                <input type="file" id="certFile" accept="image/*" style="margin-bottom: 6px;">
                <input type="text" id="certImage" placeholder="OR paste online URL / image name (e.g. cert1.jpg)">
            </div>
            <div class="form-group">
                <label>Verification Link / External Link (Optional)</label>
                <input type="text" id="certLink" placeholder="e.g. https://verify.com">
            </div>
            <div class="modal-actions">
                <button onclick="closeModal()" class="btn-cancel">Cancel</button>
                <button onclick="saveCertificate()" class="btn-add-cert">Save Certificate</button>
            </div>
        </div>
    </div>

    <!-- Full-Screen Image Viewer Modal -->
    <div class="viewer-overlay" id="imageViewerModal" onclick="closeViewer(event)">
        <span class="viewer-close" onclick="closeViewer(event)">&times;</span>
        <img id="fullScreenImage" class="viewer-img" src="" alt="Full Certificate View">
    </div>

        const FALLBACK_IMAGE = "data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22400%22%20height%3D%22250%22%20viewBox%3D%220%200%20400%20250%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23161b22%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20dominant-baseline%3D%22middle%22%20text-anchor%3D%22middle%22%20fill%3D%22%2358a6ff%22%20font-family%3D%22sans-serif%22%20font-size%3D%2218%22%3ECertificate%20Preview%3C%2Ftext%3E%3C%2Fsvg%3E";

        function getCertificates() {
            const saved = localStorage.getItem('navi_certificates');
            return saved ? JSON.parse(saved) : initialCertificates;
        }

        function renderCertificates() {
            const certs = getCertificates();
            const grid = document.getElementById('portfolio-grid');
            
            grid.innerHTML = certs.map((cert, index) => `
                <div class="project-card">
                    <div class="card-preview" style="padding: 0; overflow: hidden; height: 220px; cursor: pointer;" onclick="openViewer('${cert.image}')">
                        <img src="${cert.image}" alt="${cert.title}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.onerror=null; this.src='${FALLBACK_IMAGE}';">
                    </div>
                    <div class="card-info">
                        <div>
                            <h3>${cert.title}</h3>
                            <p>${cert.issuer}</p>
                        </div>
                        <div class="card-actions">
                            <button onclick="openViewer('${cert.image}')" class="icon-btn" title="View Full Screen">
                                <i class="fa-solid fa-expand"></i>
                            </button>
                            ${isAdminLoggedIn ? `
                            <button onclick="deleteCertificate(${index})" class="btn-delete" title="Delete Certificate">
                                <i class="fa-solid fa-trash"></i>
                            </button>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');

            // Toggle Admin UI
            const addBtn = document.getElementById('addCertBtn');
            const exportBtn = document.getElementById('exportCodeBtn');
            const lockIcon = document.getElementById('adminLockIcon');
            
            if (isAdminLoggedIn) {
                addBtn.style.display = 'inline-flex';
                exportBtn.style.display = 'inline-flex';
                lockIcon.classList.add('admin-active');
                lockIcon.innerHTML = '<i class="fa-solid fa-unlock"></i>';
                lockIcon.title = "Lock Admin Mode";
            } else {
                addBtn.style.display = 'none';
                exportBtn.style.display = 'none';
                lockIcon.classList.remove('admin-active');
                lockIcon.innerHTML = '<i class="fa-solid fa-lock"></i>';
                lockIcon.title = "Admin Login";
            }
        }

        /* Admin Authentication Logic */
        function handleAdminToggle() {
            if (isAdminLoggedIn) {
                isAdminLoggedIn = false;
                sessionStorage.removeItem('navi_admin_auth');
                renderCertificates();
                alert("Admin Mode Locked.");
            } else {
                const pass = prompt("Enter Admin Password to manage certificates:");
                if (pass === ADMIN_PASSWORD) {
                    isAdminLoggedIn = true;
                    sessionStorage.setItem('navi_admin_auth', 'true');
                    renderCertificates();
                } else if (pass !== null) {
                    alert("Incorrect Password!");
                }
            }
        }

        function checkAdminSession() {
            if (sessionStorage.getItem('navi_admin_auth') === 'true') {
                isAdminLoggedIn = true;
            }
        }

        /* Delete Certificate Logic */
        function deleteCertificate(index) {
            if (!isAdminLoggedIn) return;
            if (confirm("Are you sure you want to remove this certificate?")) {
                let certs = getCertificates();
                certs.splice(index, 1);
                localStorage.setItem('navi_certificates', JSON.stringify(certs));
                renderCertificates();
            }
        }

        /* Export Array Code for GitHub Commit */
        function exportCertificatesCode() {
            const certs = getCertificates();
            const jsonString = JSON.stringify(certs, null, 4);
            const codeOutput = `const initialCertificates = ${jsonString};`;
            
            navigator.clipboard.writeText(codeOutput).then(() => {
                alert("Code Copied to Clipboard!\n\nPaste this inside your code replacing 'const initialCertificates = [...]' and push to GitHub.");
            }).catch(() => {
                prompt("Copy this code and replace 'const initialCertificates = [...]' in your HTML file:", codeOutput);
            });
        }

        /* Full Screen Viewer Functions */
        function openViewer(imageSrc) {
            const modal = document.getElementById('imageViewerModal');
            const fullImg = document.getElementById('fullScreenImage');
            fullImg.src = imageSrc;
            fullImg.onerror = function() {
                this.src = FALLBACK_IMAGE;
            };
            modal.style.display = 'flex';
        }

        function closeViewer(e) {
            if (e.target.id === 'imageViewerModal' || e.target.classList.contains('viewer-close')) {
                document.getElementById('imageViewerModal').style.display = 'none';
            }
        }

        /* Add Modal Logic */
        function openModal() {
            if (!isAdminLoggedIn) return;
            document.getElementById('certModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('certModal').style.display = 'none'; }

        function saveCertificate() {
            if (!isAdminLoggedIn) return;

            const title = document.getElementById('certTitle').value.trim();
            const issuer = document.getElementById('certIssuer').value.trim();
            const imageInput = document.getElementById('certImage').value.trim();
            const link = document.getElementById('certLink').value.trim();
            const fileInput = document.getElementById('certFile').files[0];

            if (!title || !issuer) {
                alert("Please fill in the title and issuer name!");
                return;
            }

            const certs = getCertificates();

            if (fileInput) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const imgData = e.target.result;
                    certs.push({ title, issuer, image: imgData, link: link || imgData });
                    localStorage.setItem('navi_certificates', JSON.stringify(certs));
                    renderCertificates();
                    closeModal();
                    clearForm();
                };
                reader.readAsDataURL(fileInput);
            } else {
                const finalImg = imageInput || FALLBACK_IMAGE;
                certs.push({ title, issuer, image: finalImg, link: link || finalImg });
                localStorage.setItem('navi_certificates', JSON.stringify(certs));
                renderCertificates();
                closeModal();
                clearForm();
            }
        }

        function clearForm() {
            document.getElementById('certTitle').value = '';
            document.getElementById('certIssuer').value = '';
            document.getElementById('certImage').value = '';
            document.getElementById('certLink').value = '';
            document.getElementById('certFile').value = '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkAdminSession();
            renderCertificates();
        });
    </script>
</body>
